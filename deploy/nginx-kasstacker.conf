# KasStacker — nginx vhost for kasstacker.org (static Astro build).
#
#   cp deploy/nginx-kasstacker.conf /etc/nginx/sites-available/kasstacker
#   ln -s /etc/nginx/sites-available/kasstacker /etc/nginx/sites-enabled/kasstacker
#   nginx -t && systemctl reload nginx
#   # once DNS points kasstacker.org at this box:
#   certbot --nginx -d kasstacker.org -d www.kasstacker.org
#
# Fully static — no proxying, nothing else on this box is reachable through
# this vhost. Deploys are an rsync of dist/ into /var/www/kasstacker by the
# restricted `kasstacker` user (never root, never the app dirs).

server {
    listen 80;
    listen [::]:80;
    server_name kasstacker.org www.kasstacker.org;

    root /var/www/kasstacker;
    index index.html;

    # Leave ACME on plain HTTP so renewals don't depend on the cert they renew
    # (same pattern as the dagmate vhost).
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Astro static output: /learn resolves to /learn/index.html.
    location / { try_files $uri $uri/ =404; }

    # Astro content-hashes everything under /_astro — safe to cache hard.
    location /_astro/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # HTML is not hashed: keep it short so a deploy shows within minutes.
    location ~ \.html$ { expires 5m; }
}

name: Verify build-page commands

# Runs, in a fresh container, the EXACT commands the /build pages tell readers
# to run. If upstream moves and a command breaks, this goes red — meaning the
# site's build guides are stale and need re-verifying, per the site's data
# rules (nothing on a page that hasn't been proven).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC

jobs:
  silverscript:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone (as the setup page instructs)
        run: git clone https://github.com/kaspanet/silverscript
      - name: cargo test -p silverscript-lang
        working-directory: silverscript
        run: cargo test -p silverscript-lang
      - name: Compile the first-covenant page's SimpleCovenant
        working-directory: silverscript
        run: |
          cat > simple.sil <<'EOF'
          pragma silverscript ^0.1.0;

          contract SimpleCovenant(pubkey recipient) {
              entry spend() {
                  byte[36] recipientScriptPubKey = new ScriptPubKeyP2PK(recipient);
                  require(tx.outputs[0].scriptPubKey == byte[](recipientScriptPubKey));
              }
          }
          EOF
          cargo run -p silverscript-lang --bin silverc -- simple.sil -o artifact.json
          test -s artifact.json && echo "artifact written: $(wc -c < artifact.json) bytes"
      - name: Run the CLI debugger example
        working-directory: silverscript
        run: |
          cargo run -p cli-debugger -- silverscript-lang/tests/examples/if_statement.sil \
            --function hello --ctor-arg 3 --ctor-arg 10 --arg 1 --arg 2

  argent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone (as the setup page instructs)
        run: git clone https://github.com/argent-lang/argent
      - name: ./check.sh
        working-directory: argent
        run: ./check.sh
      - name: Build and inspect the tickets example
        working-directory: argent
        run: |
          cargo run -- build examples/tickets.ag --out examples/build/tickets
          cargo run --bin argentc -- inspect examples/build/tickets

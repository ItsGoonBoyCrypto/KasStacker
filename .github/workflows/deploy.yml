name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_call from refresh-status lands after its commit; always build the tip
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      # Deploys as the restricted `kasstacker` user, which owns only
      # /var/www/kasstacker — CI never holds anything with wider access.
      - name: Deploy to server
        env:
          DEPLOY_KEY: ${{ secrets.KASSTACKER_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 178.105.167.184 >> ~/.ssh/known_hosts
          rsync -az --delete --chmod=D755,F644 dist/ kasstacker@178.105.167.184:/var/www/kasstacker/

name: Verify community examples

# LISTED repos (on /build/examples) must stay clean — a failure here means the
# page is wrong and goes red. WATCH repos are the under-review set: they are
# re-checked and reported daily so we notice the moment one updates to
# current Silverscript, but they never fail the job.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * *' # daily, after verify-build-commands

jobs:
  compile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone silverscript
        run: git clone --depth 1 https://github.com/kaspanet/silverscript
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: silverscript
      - name: Build silverc once
        run: cd silverscript && cargo build -p silverscript-lang --bin silverc
      - name: Check repos
        run: |
          SILVERC="$PWD/silverscript/target/debug/silverc"
          LISTED="La-Gauffre/KaspaRocket-Silverscript-Contract volkanglm/toccata-covenant-tools"
          WATCH="trillskillz/OpenSilver ko-sign/kosign K100bet/contracts Knitser/kasmelt-snapshot"
          check_repo() { # $1 repo slug; echoes "compiled parsed failed total"
            dir="cand/$(echo "$1" | tr '/' '_')"
            git clone --depth 1 "https://github.com/$1" "$dir" -q
            local total=0 compiled=0 parsed=0 failed=0
            while IFS= read -r sil; do
              total=$((total+1))
              if "$SILVERC" "$sil" -c > /dev/null 2>&1; then compiled=$((compiled+1))
              elif "$SILVERC" "$sil" --ast-only > /dev/null 2>&1; then parsed=$((parsed+1))
              else failed=$((failed+1)); echo "  FAIL $sil" >&2
              fi
            done < <(find "$dir" -name '*.sil' -not -path '*/node_modules/*')
            echo "$compiled $parsed $failed $total"
          }
          overall=0
          echo "== LISTED (must be clean) =="
          for repo in $LISTED; do
            read -r c p f t <<< "$(check_repo "$repo")"
            echo "$repo: $t .sil — $c compile, $p parse-only, $f fail"
            if [ "$f" -gt 0 ]; then overall=1; fi
          done
          echo "== WATCH (report-only; a repo going clean here is ready to list) =="
          for repo in $WATCH; do
            read -r c p f t <<< "$(check_repo "$repo")"
            echo "$repo: $t .sil — $c compile, $p parse-only, $f fail"
          done
          exit $overall

  # kcc20-live is LISTED on /build/examples as the first verified third-party
  # Argent contract — this check gates: red means the listing is stale.
  argent-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone argent + candidate
        run: |
          git clone --depth 1 https://github.com/argent-lang/argent
          git clone --depth 1 https://github.com/Manyfestation/kcc20-live
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: argent
      - name: Build the candidate's contract with argentc
        working-directory: argent
        run: cargo run -- build ../kcc20-live/contracts/kcc20.ag --out /tmp/kcc20-live-build
